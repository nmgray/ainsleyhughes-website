app = "ainsley-hughes"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  PROTOCOL_HEADER = "x-forwarded-proto"
  HOST_HEADER = "host"
  CONTENT_DB_PATH = "/data/content.sqlite"
  CONTENT_UPLOAD_DIR = "/data/uploads"

[mounts]
  source = "ainsley_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
